<!DOCTYPE html><!--this is a standard sort of user directive that ensures the website is interpreted as a standard html format.... not having this coded here could mean that the website is misinterpreted for something else.-->
<html lang="en"><!--always need to start and end the entire scope of your html code with html in angled brackets, like this <html></html>. This tag represents the root of an html document (webpage) and all other elements are nested within it.-->
  <head><!--this defines what your website is or what it's called; represents information about a webpage, though it won't display on the webpage itself. This is what will display on the browser tab containing your webpage.-->
    <meta charset="utf-8" /><!--every single character or phrase contained within the angle brackets <> represents what are known as tags. Tags define elements, which are essentially the content contained within tags.-->
    <meta name="viewport" content="width=device-width, initial-scale=1" /><!--html can be considered as the backbone of web development; it serves as the structure and content for all webpage design.-->
    <title>Final Project #01</title><!--it's good practice to title all html based documents as 'index.html' because when a connection is made to a website containing a URL without a specific file mentioned in it, a browser might default to such a file name as index.html, and this also serves as what's known as a landing page for your webpage.... the first page you come across when accessing a web address.-->
    <link rel="stylesheet" href="./index.css" /><!--by placing your cursor over any tag in an html document, it will tell you briefly what its definition is.-->
  </head>

    <main>
      <section>
        
        <center><h1 style = "font-size: 100px;">Personal Finance Trainer Prototype</h1></center><!--centers the header.--><!--makes font much bigger, since h1 is the largest predefined font size.--><!--changed title of project to finance from financial.... sounded like it had too many adjectives.-->
        <hr><!--this is known as a horizontal rule element, and it adds a line that stretches across or webpage. No end tag needed for this tag.-->
        <img id="avatar" src="./images/COL1A00.png"/>
          <h1>Dashboard</h1>
          <br><!--use this tag to make a break or line space. No end tag needed for this tag.-->
          <a href = "https://google.com" target = _self title = "This takes you to Google."><!--to make a basic hyperlink, use the a tag, then the href pointer to list the site address, then target to determine where to display the linked site address (URL) [in this case, _self displays it at the bottom left corner of the page], and then title also to write in a description of where the link takes you.-->
          Google<!--this is exactly what the hyperlink will display as on the webpage.-->
          </a>
          <div>
            <h3>Another Sub Heading</h3>
            <p>Lorem ipsum...</p>
          </div>
        </section>
      </article>
    </main>
